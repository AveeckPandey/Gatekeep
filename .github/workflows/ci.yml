name: GateKeep CI/CD & Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-security-and-tests:
    name: Backend Lint, SAST & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest pytest-asyncio respx "moto[dynamodb]"

      - name: Run Ruff Code Quality Checks
        run: |
          ruff check app

      - name: Run Bandit Security SAST Scanning
        run: |
          bandit -r app -ll

      - name: Run Pytest Test Suite
        env:
          REPOSITORY_BACKEND: in_memory
          JWT_SECRET_KEY: ci-cd-testing-secret-key-32-chars-long
          GATEKEEP_ENCRYPTION_KEY: Z2F0ZWtlZXAtdGVzdC1mZXJuZXQta2V5LTMyYnl0ZXM=
        run: |
          pytest -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Production App
        env:
          NEXT_PUBLIC_API_URL: https://api.gatekeep.local
        run: npm run build

  deploy-lambda:
    name: Auto Deploy to AWS Lambda (Main Branch)
    needs: [backend-security-and-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package & Deploy to AWS Lambda
        run: |
          python -m pip install --upgrade pip
          pip install boto3
          python scripts/deploy_aws.py --auto-confirm
