name: GateKeep CI & Security Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-security-and-tests:
    name: Backend Lint, SAST & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest pytest-asyncio respx "moto[dynamodb]"

      - name: Run Ruff Code Quality Checks
        run: |
          ruff check app

      - name: Run Bandit Security SAST Scanning
        run: |
          bandit -r app -ll

      - name: Run Pytest Test Suite
        env:
          REPOSITORY_BACKEND: in_memory
          AUTH_BACKEND: local
          ENV: development
          ENABLE_DEMO_ENDPOINT: "true"
        run: |
          python -m pytest -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Production App
        env:
          NEXT_PUBLIC_API_URL: https://api.gatekeep.local
        run: npm run build

  # Production uses EC2. Deploy a verified checkout with scripts/deploy_ec2_update.py;
  # this workflow deliberately does not provision or deploy the retired Lambda path.
