# GateKeep Nginx Reverse Proxy & Hardened Edge Configuration
# Path on Ubuntu: /etc/nginx/sites-available/aegisgate.conf
# Enabled via: sudo ln -s /etc/nginx/sites-available/aegisgate.conf /etc/nginx/sites-enabled/

# Rate limiting zone: 10MB state storage (~160,000 IP addresses), 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=gatekeep_rate_limit:10m rate=30r/s;
limit_req_status 429;

# Upstream Uvicorn ASGI Application (Localhost only)
upstream aegisgate_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP Server: Enforce HTTPS Redirect & ACME Challenge
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Hide Nginx version
    server_tokens off;

    # Let's Encrypt / Certbot challenge validation path
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server: Hardened Reverse Proxy with Security Headers
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # Hide Nginx version and banner
    server_tokens off;

    # SSL / TLS Hardening (Enforce TLS 1.2 and TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Certbot certificate paths (populated by certbot --nginx)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Self-signed fallback / development certs (if certbot not yet run)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Max request payload size: 1MB (enforces payload limit for LLM gateway)
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none';" always;

    # Rate Limiting: Burst of 20 requests with nodelay, returns HTTP 429 when exceeded
    limit_req zone=gatekeep_rate_limit burst=20 nodelay;

    # Reverse Proxy to Uvicorn Backend (127.0.0.1:8000)
    location / {
        proxy_pass http://aegisgate_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & Streaming support (e.g. SSE stream: true)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for upstream LLM response streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for low-latency streaming responses
        proxy_buffering off;
    }

    # Explicitly drop access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
